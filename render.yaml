# Render Blueprint — deploys the whole Boli platform (backend API, 3 static
# frontends, and a free Postgres database) from one repo in one go.
#
# Usage: on Render, "New +" -> "Blueprint", connect this repo, and Render
# reads this file automatically.
#
# Note on URLs: Render assigns each service the public URL
# https://<name>.onrender.com, where <name> is the field below. Since Render
# has no Blueprint property that yields a service's public HTTPS URL (only
# private-network host/port), the URLs are hardcoded to match the service
# names chosen here. If Render has to rename a service to keep it unique
# (e.g. a "-1" suffix), update the affected env vars below and in each
# service's dashboard to match.

databases:
  - name: boli-db
    plan: free

services:
  - name: boli-backend
    type: web
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace=packages/shared && npx prisma generate --schema=backend/prisma/schema.prisma && npm run build --workspace=backend
    startCommand: npx prisma db push --schema=backend/prisma/schema.prisma --accept-data-loss && npx tsx backend/prisma/seed.ts && node backend/dist/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boli-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_GUEST_SECRET
        generateValue: true
      - key: JWT_STAFF_SECRET
        generateValue: true
      - key: JWT_ADMIN_SECRET
        generateValue: true
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: SMS_PROVIDER
        value: mock
      - key: GUEST_APP_URL
        value: https://boli-guest-app.onrender.com
      - key: ADMIN_PORTAL_URL
        value: https://boli-admin-portal.onrender.com

  - name: boli-guest-app
    type: web
    runtime: static
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run build --workspace=guest-app
    staticPublishPath: guest-app/dist
    envVars:
      - key: VITE_API_URL
        value: https://boli-backend.onrender.com

  - name: boli-merchant-dashboard
    type: web
    runtime: static
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run build --workspace=merchant-dashboard
    staticPublishPath: merchant-dashboard/dist
    envVars:
      - key: VITE_API_URL
        value: https://boli-backend.onrender.com

  - name: boli-admin-portal
    type: web
    runtime: static
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run build --workspace=admin-portal
    staticPublishPath: admin-portal/dist
    envVars:
      - key: VITE_API_URL
        value: https://boli-backend.onrender.com
